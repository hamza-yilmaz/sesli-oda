<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sesli Oda</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#1e1f22;--panel:#2b2d31;--panel2:#313338;--text:#f2f3f5;--muted:#9ca0a8;--accent:#5865f2;--green:#23a559;--red:#da373c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;align-items:center;justify-content:center}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 16px;color:var(--text);background:var(--accent)}
button:hover{filter:brightness(1.1)}
button.gray{background:#4e5058}
button.red{background:var(--red)}
input[type=text]{font:inherit;width:100%;padding:11px 12px;border-radius:8px;border:1px solid #1a1b1e;background:#1a1b1e;color:var(--text);outline:none}
input[type=text]:focus{border-color:var(--accent)}
.card{background:var(--panel);padding:28px;border-radius:14px;width:min(420px,92vw);display:flex;flex-direction:column;gap:14px}
.card h1{font-size:22px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px}
#app{display:none;width:100vw;height:100vh;grid-template-columns:1fr 340px}
#left{display:flex;flex-direction:column;padding:18px;gap:14px;min-width:0}
#top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
#codeBox{background:var(--panel);padding:8px 12px;border-radius:8px;font-family:monospace;font-size:15px;display:flex;gap:10px;align-items:center}
#users{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;align-content:start}
.user{background:var(--panel);border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;border:3px solid transparent;transition:border-color .1s}
.user.speaking{border-color:var(--green)}
.avatar{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;background:var(--accent)}
.uname{font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctrl{display:flex;align-items:center;gap:8px;width:100%}
.ctrl input[type=range]{flex:1}
.mini{padding:6px 10px;font-size:13px}
#bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;background:var(--panel);padding:12px;border-radius:12px}
#right{background:var(--panel);display:flex;flex-direction:column;border-left:1px solid #1a1b1e;min-height:0}
#right h3{padding:14px 16px;border-bottom:1px solid #1a1b1e;font-size:15px}
#msgs{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.msg b{font-size:13px}.msg span{display:block;font-size:14px;word-break:break-word}
#chatForm{display:flex;gap:8px;padding:12px}
#settings{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center}
#settings .card{max-height:90vh;overflow:auto}
label.chk{display:flex;gap:10px;align-items:center;font-size:14px}
select{font:inherit;width:100%;padding:10px;border-radius:8px;background:#1a1b1e;color:var(--text);border:1px solid #1a1b1e}
@media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:1fr 260px}#right{border-left:0;border-top:1px solid #1a1b1e}}
</style>
</head>
<body>

<div class="card" id="lobby">
  <h1>🎙️ Sesli Oda</h1>
  <p class="muted">Sunucu yok, hesap yok. Oda kapanınca her şey silinir.</p>
  <input type="text" id="nameIn" placeholder="Adın" maxlength="20">
  <button id="createBtn">Yeni oda aç</button>
  <div class="row">
    <input type="text" id="codeIn" placeholder="Oda kodu">
    <button id="joinBtn" class="gray">Katıl</button>
  </div>
  <p class="muted" id="lobbyMsg"></p>
</div>

<div id="app">
  <div id="left">
    <div id="top">
      <div id="codeBox"><span id="codeTxt"></span><button class="mini gray" id="copyBtn">Kopyala</button></div>
      <span class="muted" id="status"></span>
    </div>
    <div id="users"></div>
    <div id="bar">
      <button id="muteBtn">🎤 Mikrofon açık</button>
      <button id="deafBtn" class="gray">🔊 Ses açık</button>
      <button id="setBtn" class="gray">⚙️ Ses ayarları</button>
      <button id="leaveBtn" class="red">Ayrıl</button>
    </div>
  </div>
  <div id="right">
    <h3>Oda sohbeti</h3>
    <div id="msgs"></div>
    <form id="chatForm"><input type="text" id="chatIn" placeholder="Mesaj yaz..." autocomplete="off"><button>Gönder</button></form>
  </div>
</div>

<div id="settings">
  <div class="card">
    <h1>Ses ayarları</h1>
    <label class="chk"><input type="checkbox" id="nsChk" checked> Gürültü bastırma (arka plan sesleri)</label>
    <label class="chk"><input type="checkbox" id="ecChk" checked> Yankı engelleme</label>
    <label class="chk"><input type="checkbox" id="agcChk" checked> Otomatik ses seviyesi</label>
    <label class="chk"><input type="checkbox" id="gateChk" checked> Stüdyo modu (sessizken kapı kapanır)</label>
    <div><span class="muted">Kapı eşiği</span><input type="range" id="gateRange" min="1" max="40" value="8" style="width:100%"></div>
    <div><span class="muted">Mikrofon seviyesi</span><input type="range" id="gainRange" min="0" max="200" value="100" style="width:100%"></div>
    <div><span class="muted">Mikrofon</span><select id="micSel"></select></div>
    <div><span class="muted">Hoparlör</span><select id="spkSel"></select></div>
    <div><span class="muted">Mikrofon göstergesi</span><div style="height:8px;background:#1a1b1e;border-radius:4px;overflow:hidden"><div id="meter" style="height:100%;width:0;background:var(--green)"></div></div></div>
    <button id="applyBtn">Uygula ve kapat</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]};
const PREFIX='sesliodayilmaz-';

let peer,myName,roomCode,isHost=false,hostConn=null;
let rawStream,outStream,audioCtx,srcNode,gainNode,analyser,dest;
let muted=false,deafened=false,gateOpen=true;
let conns={};   // id -> {data,call,name,audioEl,vol,localMute,analyser}
let settings={ns:true,ec:true,agc:true,gate:true,thr:8,gain:100,mic:'',spk:''};

function genCode(){const c='abcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function msg(t){$('lobbyMsg').textContent=t}

async function startMic(){
  if(rawStream)rawStream.getTracks().forEach(t=>t.stop());
  if(audioCtx)audioCtx.close();
  rawStream=await navigator.mediaDevices.getUserMedia({audio:{
    noiseSuppression:settings.ns,echoCancellation:settings.ec,autoGainControl:settings.agc,
    channelCount:1,sampleRate:48000,deviceId:settings.mic?{exact:settings.mic}:undefined}});
  audioCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:48000});
  srcNode=audioCtx.createMediaStreamSource(rawStream);
  gainNode=audioCtx.createGain();
  analyser=audioCtx.createAnalyser();analyser.fftSize=512;
  dest=audioCtx.createMediaStreamDestination();
  srcNode.connect(analyser);
  srcNode.connect(gainNode);gainNode.connect(dest);
  outStream=dest.stream;
  applyGain();
  Object.values(conns).forEach(c=>{if(c.call&&c.call.peerConnection){
    const s=c.call.peerConnection.getSenders().find(x=>x.track&&x.track.kind==='audio');
    if(s)s.replaceTrack(outStream.getAudioTracks()[0]);}});
  tuneSenders();
}
function applyGain(){
  if(!gainNode)return;
  const open=!muted&&(!settings.gate||gateOpen);
  gainNode.gain.setTargetAtTime(open?settings.gain/100:0,audioCtx.currentTime,0.03);
}
function tuneSenders(){
  Object.values(conns).forEach(c=>{if(c.call&&c.call.peerConnection){
    c.call.peerConnection.getSenders().forEach(s=>{if(s.track&&s.track.kind==='audio'){
      const p=s.getParameters();if(!p.encodings||!p.encodings.length)p.encodings=[{}];
      p.encodings[0].maxBitrate=96000;s.setParameters(p).catch(()=>{});}});}});
}
function level(an){
  const d=new Uint8Array(an.fftSize);an.getByteTimeDomainData(d);
  let m=0;for(const v of d){const x=Math.abs(v-128);if(x>m)m=x}return m;
}
let holdUntil=0;
setInterval(()=>{
  if(!analyser)return;
  const l=level(analyser);
  $('meter').style.width=Math.min(100,l*2.2)+'%';
  const now=performance.now();
  if(l>settings.thr){holdUntil=now+250}
  const g=now<holdUntil;
  if(g!==gateOpen){gateOpen=g;applyGain()}
  const speaking=!muted&&(settings.gate?gateOpen:l>6);
  setSpeaking('me',speaking);
  for(const [id,c] of Object.entries(conns)){
    if(c.analyser)setSpeaking(id,!c.localMute&&!deafened&&level(c.analyser)>8);
  }
},80);
function setSpeaking(id,on){const e=document.querySelector('[data-id="'+id+'"]');if(e)e.classList.toggle('speaking',on)}

function renderUsers(){
  const box=$('users');box.innerHTML='';
  const mk=(id,name,me)=>{
    const d=document.createElement('div');d.className='user';d.dataset.id=id;
    d.innerHTML='<div class="avatar"></div><div class="uname"></div>';
    d.querySelector('.avatar').textContent=(name||'?')[0].toUpperCase();
    d.querySelector('.uname').textContent=name+(me?' (sen)':'');
    if(!me){
      const c=conns[id];
      const ctl=document.createElement('div');ctl.className='ctrl';
      const mb=document.createElement('button');mb.className='mini gray';mb.textContent=c.localMute?'🔇':'🔊';
      mb.onclick=()=>{c.localMute=!c.localMute;if(c.audioEl)c.audioEl.muted=c.localMute||deafened;mb.textContent=c.localMute?'🔇':'🔊'};
      const r=document.createElement('input');r.type='range';r.min=0;r.max=100;r.value=c.vol;
      r.oninput=()=>{c.vol=+r.value;if(c.audioEl)c.audioEl.volume=c.vol/100};
      ctl.append(mb,r);d.append(ctl);
    }
    box.append(d);
  };
  mk('me',myName,true);
  Object.keys(conns).forEach(id=>{if(conns[id].name)mk(id,conns[id].name,false)});
  $('status').textContent=(Object.keys(conns).filter(i=>conns[i].name).length+1)+' kişi odada';
}

function addMsg(who,text){
  const d=document.createElement('div');d.className='msg';
  const b=document.createElement('b');b.textContent=who;
  const s=document.createElement('span');s.textContent=text;
  d.append(b,s);$('msgs').append(d);$('msgs').scrollTop=1e9;
}
function broadcast(obj,except){Object.entries(conns).forEach(([id,c])=>{if(id!==except&&c.data&&c.data.open)c.data.send(obj)})}

function setupData(id,data){
  conns[id]=conns[id]||{vol:100,localMute:false};
  conns[id].data=data;
  data.on('open',()=>{data.send({t:'hello',name:myName})});
  data.on('data',m=>onData(id,m));
  data.on('close',()=>dropPeer(id));
}
function onData(id,m){
  const c=conns[id];
  if(m.t==='hello'){
    c.name=m.name;renderUsers();
    if(isHost){ // yeni gelene diğerlerini tanıt
      const others=Object.keys(conns).filter(x=>x!==id&&conns[x].name);
      c.data.send({t:'peers',ids:others});
    }
  }else if(m.t==='peers'){
    m.ids.forEach(pid=>{if(!conns[pid])connectTo(pid)});
  }else if(m.t==='chat'){
    addMsg(c.name||'?',m.text);
  }
}
function connectTo(id){
  const data=peer.connect(id,{reliable:true});setupData(id,data);
  if(outStream){const call=peer.call(id,outStream);setupCall(id,call)}
}
function setupCall(id,call){
  conns[id]=conns[id]||{vol:100,localMute:false};
  conns[id].call=call;
  call.on('stream',st=>{
    const c=conns[id];if(c.audioEl)return;
    const a=new Audio();a.srcObject=st;a.autoplay=true;a.volume=c.vol/100;a.muted=c.localMute||deafened;
    if(settings.spk&&a.setSinkId)a.setSinkId(settings.spk).catch(()=>{});
    c.audioEl=a;
    const an=audioCtx.createAnalyser();an.fftSize=512;
    audioCtx.createMediaStreamSource(st).connect(an);c.analyser=an;
    tuneSenders();
  });
  call.on('close',()=>dropPeer(id));
}
function dropPeer(id){
  const c=conns[id];if(!c)return;
  if(c.audioEl){c.audioEl.srcObject=null}
  try{c.call&&c.call.close()}catch(e){}
  try{c.data&&c.data.close()}catch(e){}
  if(c.name)addMsg('•',c.name+' ayrıldı');
  delete conns[id];renderUsers();
}

function initPeer(id){
  return new Promise((res,rej)=>{
    peer=new Peer(id,{config:ICE});
    peer.on('open',()=>res());
    peer.on('error',e=>rej(e));
  });
}
function enterRoom(){
  $('lobby').style.display='none';$('app').style.display='grid';
  $('codeTxt').textContent='Oda kodu: '+roomCode;
  peer.on('connection',data=>setupData(data.peer,data));
  peer.on('call',call=>{call.answer(outStream);setupCall(call.peer,call)});
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  renderUsers();
}

$('createBtn').onclick=async()=>{
  myName=$('nameIn').value.trim();if(!myName)return msg('Önce adını yaz.');
  try{
    msg('Mikrofon açılıyor...');await startMic();
    roomCode=genCode();isHost=true;
    await initPeer(PREFIX+roomCode);
    enterRoom();
  }catch(e){msg('Hata: '+(e.type||e.message||e))}
};
$('joinBtn').onclick=async()=>{
  myName=$('nameIn').value.trim();roomCode=$('codeIn').value.trim().toLowerCase();
  if(!myName)return msg('Önce adını yaz.');if(!roomCode)return msg('Oda kodunu yaz.');
  try{
    msg('Mikrofon açılıyor...');await startMic();
    await initPeer();
    enterRoom();
    const hostId=PREFIX+roomCode;
    const data=peer.connect(hostId,{reliable:true});setupData(hostId,data);
    const call=peer.call(hostId,outStream);setupCall(hostId,call);
    setTimeout(()=>{if(!conns[hostId]||!conns[hostId].name){alert('Odaya bağlanılamadı. Kodu kontrol et.');location.reload()}},12000);
  }catch(e){msg('Hata: '+(e.type||e.message||e))}
};

$('muteBtn').onclick=()=>{
  muted=!muted;applyGain();
  $('muteBtn').textContent=muted?'🎤 Mikrofon kapalı':'🎤 Mikrofon açık';
  $('muteBtn').className=muted?'red':'';
};
$('deafBtn').onclick=()=>{
  deafened=!deafened;
  Object.values(conns).forEach(c=>{if(c.audioEl)c.audioEl.muted=deafened||c.localMute});
  $('deafBtn').textContent=deafened?'🔇 Ses kapalı':'🔊 Ses açık';
  $('deafBtn').className=deafened?'red':'gray';
};
$('leaveBtn').onclick=()=>{if(confirm('Odadan ayrılmak istiyor musun?')){try{peer.destroy()}catch(e){}location.reload()}};
$('copyBtn').onclick=()=>{navigator.clipboard.writeText(roomCode);$('copyBtn').textContent='Kopyalandı';setTimeout(()=>$('copyBtn').textContent='Kopyala',1500)};
$('chatForm').onsubmit=e=>{
  e.preventDefault();const t=$('chatIn').value.trim();if(!t)return;
  addMsg(myName+' (sen)',t);broadcast({t:'chat',text:t});$('chatIn').value='';
};

$('setBtn').onclick=async()=>{
  $('nsChk').checked=settings.ns;$('ecChk').checked=settings.ec;$('agcChk').checked=settings.agc;
  $('gateChk').checked=settings.gate;$('gateRange').value=settings.thr;$('gainRange').value=settings.gain;
  const devs=await navigator.mediaDevices.enumerateDevices();
  const fill=(sel,kind,cur)=>{sel.innerHTML='<option value="">Varsayılan</option>';
    devs.filter(d=>d.kind===kind).forEach(d=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||kind;if(d.deviceId===cur)o.selected=true;sel.append(o)})};
  fill($('micSel'),'audioinput',settings.mic);fill($('spkSel'),'audiooutput',settings.spk);
  $('settings').style.display='flex';
};
$('gateRange').oninput=()=>{settings.thr=+$('gateRange').value};
$('gainRange').oninput=()=>{settings.gain=+$('gainRange').value;applyGain()};
$('gateChk').onchange=()=>{settings.gate=$('gateChk').checked;applyGain()};
$('applyBtn').onclick=async()=>{
  const old=JSON.stringify([settings.ns,settings.ec,settings.agc,settings.mic]);
  settings.ns=$('nsChk').checked;settings.ec=$('ecChk').checked;settings.agc=$('agcChk').checked;
  settings.gate=$('gateChk').checked;settings.mic=$('micSel').value;settings.spk=$('spkSel').value;
  if(old!==JSON.stringify([settings.ns,settings.ec,settings.agc,settings.mic])){try{await startMic()}catch(e){alert('Mikrofon açılamadı: '+e.message)}}
  Object.values(conns).forEach(c=>{if(c.audioEl&&c.audioEl.setSinkId&&settings.spk)c.audioEl.setSinkId(settings.spk).catch(()=>{})});
  applyGain();$('settings').style.display='none';
};
</script>
</body>
</html>
